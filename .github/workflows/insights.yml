name: Collect Reel numbers
on:
  schedule:
    - cron: "0 13 * * *"   # 7:00 am US Central
  workflow_dispatch:
permissions:
  contents: write
concurrency: womm-state
jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/ci_insights.py
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json published.log insights.json 2>/dev/null || git add -u
          git diff --cached --quiet || (git commit -m "Update posting state" && git pull --rebase && git push)
